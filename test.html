<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <script src="vocabulary-A1.js"></script>
    <script src="vocabulary-topics.js"></script>
</head>
<body>
    <h1>测试页面</h1>
    <div id="result"></div>
    <button onclick="testLoad()">测试加载词汇</button>
    <script>
        function testLoad() {
            const result = document.getElementById('result');
            try {
                if (typeof VOCABULARY_A1 !== 'undefined') {
                    result.innerHTML = '<p style="color: green;">✅ VOCABULARY_A1 加载成功！共 ' + VOCABULARY_A1.length + ' 个单词</p>';
                } else {
                    result.innerHTML = '<p style="color: red;">❌ VOCABULARY_A1 未加载</p>';
                }
                if (typeof VOCABULARY_TOPICS !== 'undefined') {
                    result.innerHTML += '<p style="color: green;">✅ VOCABULARY_TOPICS 加载成功！共 ' + Object.keys(VOCABULARY_TOPICS).length + ' 个主题</p>';
                } else {
                    result.innerHTML += '<p style="color: red;">❌ VOCABULARY_TOPICS 未加载</p>';
                }
            } catch (e) {
                result.innerHTML = '<p style="color: red;">❌ 错误: ' + e.message + '</p>';
            }
        }
    </script>
</body>
</html>
